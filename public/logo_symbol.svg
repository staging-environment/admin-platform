<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Clip path to keep everything within the main ellipse -->
    <clipPath id="ellipse-clip">
      <ellipse cx="200" cy="200" rx="180" ry="140" />
    </clipPath>
    
    <!-- Linear gradient for the blue areas -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052d4" />
      <stop offset="50%" stop-color="#0035ad" />
      <stop offset="100%" stop-color="#001c58" />
    </linearGradient>
  </defs>

  <!-- Outer White Frame / Border -->
  <ellipse cx="200" cy="200" rx="183" ry="143" fill="#ffffff" stroke="#0035ad" stroke-width="4" />

  <!-- Main Content Area -->
  <g clip-path="url(#ellipse-clip)">
    <!-- White Background Face -->
    <rect width="400" height="400" fill="#ffffff" />

    <!-- Left Blue Blob -->
    <path d="M 140,20 C 190,100 190,300 140,380 L -10,380 L -10,20 Z" fill="url(#blue-grad)" />

    <!-- Right Blue Blob -->
    <path d="M 260,20 C 210,100 210,300 260,380 L 410,380 L 410,20 Z" fill="url(#blue-grad)" />
  </g>
</svg>
